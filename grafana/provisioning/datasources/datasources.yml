# Grafana Datasources Provisioning
# This file automatically configures datasources when Grafana starts
# Location: grafana/provisioning/datasources/datasources.yml

apiVersion: 1

# List of datasources to insert/update
datasources:
  # ============================================
  # Prometheus Datasource
  # ============================================
  - name: Prometheus
    type: prometheus
    uid: prometheus-uid
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # Prometheus settings
      timeInterval: 15s
      httpMethod: POST
#      exemplarTraceIdDestinations:
#        - name: trace_id
#          datasourceUid: tempo

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    basicAuth: false
    isDefault: false
    version: 1
    editable: false
    apiVersion: 1
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: \[.+,(.+?),
          name: TraceID
          url: $${__value.raw}
